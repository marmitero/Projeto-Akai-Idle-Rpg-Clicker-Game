<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#101018" />
    <title>Projeto Akai — Idle RPG Clicker</title>
    <style>
      :root {
        --panel: #141420;
        --panel-2: #1d1d2e;
        --border: #3a3a55;
        --text: #e8e6da;
        --muted: #9a97b0;
        --gold: #f0b429;
        --danger: #e05656;
        --ok: #7fd47f;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #07070c; color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        overscroll-behavior: none; touch-action: manipulation;
      }
      #app {
        position: relative;
        height: 100dvh;
        max-width: 560px;
        margin: 0 auto;
        display: flex; flex-direction: column;
        background: var(--panel);
        box-shadow: 0 0 40px rgba(0,0,0,.6);
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      #hud {
        display: flex; gap: 10px; align-items: center;
        padding: 6px 10px; min-height: 44px;
        background: linear-gradient(#1d1d2e, #141420);
        border-bottom: 1px solid var(--border);
        overflow-x: auto; scrollbar-width: none;
      }
      #hud .res { display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; font-size: 14px; }
      #hud .res img { width: 22px; height: 22px; image-rendering: pixelated; }
      #hud .res.coins { color: var(--gold); font-weight: 600; }
      #mode-badge {
        margin-left: auto; font-size: 10px; letter-spacing: .08em;
        padding: 3px 6px; border: 1px solid var(--border); border-radius: 4px;
        color: var(--muted); background: #0d0d16; cursor: pointer; white-space: nowrap;
      }
      #stage { position: relative; flex: 1 1 auto; min-height: 0; }
      #stage canvas { display: block; image-rendering: pixelated; }
      #combat-overlay {
        position: absolute; top: 6px; left: 8px; right: 8px;
        display: flex; justify-content: space-between; align-items: center;
        pointer-events: none; font-size: 12px; text-shadow: 0 1px 0 #000, 0 0 6px #000;
      }
      #combat-overlay .pill {
        background: rgba(10,10,18,.72); border: 1px solid var(--border);
        border-radius: 6px; padding: 3px 8px;
      }
      #boss-timer { color: var(--danger); font-weight: 700; display: none; }
      #combat-actions { position: absolute; top: 30px; right: 8px; display: flex; flex-direction: column; gap: 6px; }
      #panel {
        flex: 0 0 auto; max-height: 34dvh; min-height: 150px;
        background: var(--panel); border-top: 2px solid var(--border);
        display: flex; flex-direction: column;
      }
      #tabs { display: flex; border-bottom: 1px solid var(--border); }
      #tabs button {
        flex: 1; padding: 10px 0; background: transparent; color: var(--muted);
        border: 0; border-bottom: 2px solid transparent; font-size: 13px; font-weight: 600;
        min-height: 44px;
      }
      #tabs button.active { color: var(--text); border-bottom-color: var(--gold); }
      #panel-body { overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
      .card {
        display: flex; align-items: center; gap: 8px;
        background: var(--panel-2); border: 1px solid var(--border);
        border-radius: 8px; padding: 8px;
      }
      .card img.node { width: 40px; height: 40px; image-rendering: pixelated; }
      .card .info { flex: 1 1 auto; min-width: 0; }
      .card .name { font-size: 13px; font-weight: 700; }
      .card .meta { font-size: 11px; color: var(--muted); }
      .card .cost { display: flex; gap: 6px; align-items: center; font-size: 11px; margin-top: 2px; }
      .card .cost img { width: 14px; height: 14px; image-rendering: pixelated; }
      .card button {
        min-width: 84px; min-height: 44px; border-radius: 8px; border: 1px solid var(--border);
        background: #262640; color: var(--text); font-weight: 700; font-size: 12px;
      }
      .card button:disabled { opacity: .45; }
      .card button.buyable { background: #2c4a2c; border-color: #4d7c4d; }
      .card.locked { opacity: .8; }
      #banner {
        position: absolute; left: 0; right: 0; top: 44px; z-index: 30;
        background: #402020; color: #ffd7d7; text-align: center;
        font-size: 12px; padding: 4px; display: none;
      }
      #loading {
        position: absolute; inset: 0; z-index: 40; background: #07070c;
        display: flex; flex-direction: column; gap: 10px;
        align-items: center; justify-content: center; font-size: 14px;
      }
      #loading .bar { width: 60%; height: 8px; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
      #loading .bar > div { height: 100%; width: 0%; background: var(--gold); transition: width .2s; }
      #loading ul { font-size: 11px; color: var(--danger); max-height: 30%; overflow: auto; padding: 0 16px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud" aria-live="polite"></div>
      <div id="stage">
        <div id="combat-overlay">
          <span class="pill" id="floor-label">Andar 1</span>
          <span class="pill" id="wave-label">Onda 1/3</span>
          <span class="pill" id="boss-timer">60s</span>
        </div>
        <div id="combat-actions">
          <button id="btn-speed" class="pill" style="pointer-events:auto">1x</button>
          <button id="btn-auto" class="pill" style="pointer-events:auto">Auto: ON</button>
          <button id="btn-retry" class="pill" style="pointer-events:auto; display:none">Tentar boss</button>
        </div>
        <div id="banner"></div>
        <div id="loading">
          <div>Carregando Assets…</div>
          <div class="bar"><div id="load-progress"></div></div>
          <ul id="load-errors"></ul>
        </div>
      </div>
      <div id="panel">
        <div id="tabs" role="tablist">
          <button id="tab-mines" class="active" role="tab">Minas</button>
          <button id="tab-upgrades" role="tab">Melhorias</button>
        </div>
        <div id="panel-body"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
